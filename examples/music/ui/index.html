<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Müzik</title>
<style>
  :root { --bg: #1e1f22; --text: #dbdee1; --muted: #949ba4; --accent: #6c6cff; --border: rgba(255,255,255,.08); --hover: rgba(255,255,255,.06); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { padding: 12px 16px 16px; }
  .now { display: flex; gap: 14px; align-items: center; }
  .cover { width: 72px; height: 72px; flex: none; border-radius: 10px; background: var(--hover) center / cover no-repeat; display: grid; place-items: center; color: var(--muted); overflow: hidden; }
  .cover svg { width: 30px; height: 30px; }
  .cover.img svg { display: none; }
  .meta { min-width: 0; flex: 1; }
  .meta b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .artist, .meta .by { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { margin-top: 12px; }
  .track { height: 4px; border-radius: 2px; background: var(--hover); overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--accent); transition: width .9s linear; }
  .times { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .ctl { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  button { font: inherit; color: var(--text); background: var(--hover); border: 0; border-radius: 6px; height: 32px; padding: 0 12px; cursor: pointer; }
  button:hover { filter: brightness(1.25); }
  button:disabled { opacity: .5; cursor: default; filter: none; }
  button.primary { background: var(--accent); color: #fff; }
  button.icon { width: 36px; padding: 0; display: grid; place-items: center; }
  button.round { width: 40px; height: 40px; border-radius: 50%; }
  button svg { width: 16px; height: 16px; }
  .vol { display: flex; align-items: center; gap: 8px; margin-left: auto; color: var(--muted); font-size: 12px; }
  .vol input { width: 110px; accent-color: var(--accent); }
  .vol span { width: 32px; text-align: right; font-variant-numeric: tabular-nums; }
  .notice { margin-top: 10px; padding: 8px 10px; border-radius: 6px; background: rgba(240,178,50,.12); color: #f0b232; font-size: 12px; }
  .row { display: flex; gap: 8px; margin: 14px 0 4px; }
  input[type=text] { flex: 1; min-width: 0; height: 34px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text); padding: 0 10px; font: inherit; }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  .hint { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  .qhead { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 6px; }
  h4 { margin: 0; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .link { background: none; height: auto; padding: 0; color: var(--muted); font-size: 12px; }
  .link:hover { color: var(--text); filter: none; text-decoration: underline; }
  .item { display: flex; align-items: center; gap: 10px; padding: 6px 8px; margin: 0 -8px; border-radius: 6px; }
  .item:hover { background: var(--hover); }
  .item i { width: 18px; color: var(--muted); font-style: normal; font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
  .item div { flex: 1; min-width: 0; }
  .item b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item small { color: var(--muted); font-size: 11px; }
  .item button { height: 24px; width: 24px; padding: 0; background: none; color: var(--muted); visibility: hidden; }
  .item:hover button { visibility: visible; }
  .empty { color: var(--muted); font-size: 13px; padding: 4px 0; }
  .sec { margin-top: 18px; }
  .item .acts { display: flex; gap: 4px; visibility: hidden; }
  .item:hover .acts { visibility: visible; }
  .item .acts button { width: auto; padding: 0 8px; visibility: visible; }
  .item .play { color: var(--accent); }
  .err { margin-top: 10px; padding: 8px 10px; border-radius: 6px; background: rgba(242,63,67,.12); color: #f23f43; font-size: 12px; }
  .editor { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .editor textarea { min-height: 180px; resize: vertical; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text); padding: 8px 10px; font: 13px/1.45 inherit; }
  .editor textarea:focus { outline: none; border-color: var(--accent); }
  .editor .bt { display: flex; gap: 8px; align-items: center; }
  .editor .bt span { color: var(--muted); font-size: 12px; margin-right: auto; }
</style>
</head>
<body>
  <div class="now">
    <div class="cover" id="cover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
    <div class="meta"><b id="title">Bir şey çalmıyor</b><span class="artist" id="artist">Aşağıya şarkı adı ya da bağlantı yaz</span><span class="by" id="by"></span></div>
  </div>
  <div class="bar" id="bar" hidden><div class="track"><div class="fill" id="fill"></div></div><div class="times"><span id="t0">0:00</span><span id="t1"></span></div></div>
  <div class="ctl" id="ctl" hidden>
    <button class="icon round primary" id="pp" title="Duraklat"></button>
    <button class="icon" id="skip" title="Atla"></button>
    <button class="icon" id="stop" title="Botu kapat"></button>
    <label class="vol"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg><input type="range" id="vol" min="0" max="100"><span id="volv"></span></label>
  </div>
  <div class="notice" id="notice" hidden></div>
  <div class="row" id="f"><input type="text" id="q" maxlength="500" placeholder="Şarkı adı ya da YouTube / SoundCloud bağlantısı" autocomplete="off"><button type="button" class="primary" id="add">Çal</button></div>
  <p class="hint">Şarkı adı yazarsan aranır. Her ses kanalının kendi botu var.</p>
  <div class="qhead"><h4 id="qtitle">Sıra</h4><button class="link" id="clear" hidden>Temizle</button></div>
  <div id="queue"><div class="empty">Sıra boş.</div></div>
  <div class="err" id="err" hidden></div>
  <div class="sec">
    <div class="qhead"><h4>Çalma listeleri</h4><button class="link" id="newlist">+ Yeni liste</button></div>
    <div id="lists"><div class="empty">Liste yok.</div></div>
    <div class="editor" id="editor" hidden>
      <input type="text" id="plname" maxlength="40" placeholder="Liste adı (ör. Akşam listesi)" autocomplete="off">
      <textarea id="plsongs" spellcheck="false" placeholder="Her satıra bir şarkı adı ya da bağlantı:&#10;Tarkan - Şımarık&#10;https://www.youtube.com/watch?v=…"></textarea>
      <div class="bt"><span id="plcount">0 şarkı</span><button type="button" id="plcancel">Vazgeç</button><button type="button" class="primary" id="plsave">Kaydet</button></div>
    </div>
  </div>
<script>
  // Bunker plugin penceresi: durum panelden ({bunker:"state"}), islemler panele ({bunker:"action"})
  const $ = (id) => document.getElementById(id);
  const act = (name, data) => parent.postMessage({ bunker: "action", name, data }, "*");
  const ICON = {
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
    skip: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 5v14l10-7z"/><rect x="16" y="5" width="3" height="14" rx="1"/></svg>',
    stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  };
  $("skip").innerHTML = ICON.skip;
  $("stop").innerHTML = ICON.stop;
  const mmss = (s) => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  let st = null, rx = 0, volTimer = 0, dragging = false, asked = false, me = null, manage = false, editing = null, errTimer = 0;

  function tick() {
    const n = st?.now;
    if (!n || !st.playing) { $("fill").style.width = "0"; $("t0").textContent = st?.connecting || (n && !st.playing) ? "Hazırlanıyor…" : "0:00"; $("t1").textContent = n?.duration ? mmss(n.duration) : ""; return; }
    const el = st.elapsed + (st.paused ? 0 : (Date.now() - rx) / 1000);
    $("t0").textContent = mmss(el);
    $("t1").textContent = n.duration ? mmss(n.duration) : "canlı";
    $("fill").style.width = n.duration ? Math.min(100, (el / n.duration) * 100) + "%" : "100%";
  }
  setInterval(tick, 1000);

  function render() {
    const n = st?.now;
    const cover = $("cover");
    cover.style.backgroundImage = n?.thumb ? `url("${n.thumb.replace(/"/g, "")}")` : "";
    cover.classList.toggle("img", Boolean(n?.thumb));
    $("title").textContent = n ? n.title : st?.connecting ? "Bot kanala bağlanıyor…" : "Bir şey çalmıyor";
    $("artist").textContent = n ? (n.artist || "") : "Aşağıya şarkı adı ya da bağlantı yaz";
    $("by").textContent = n ? "İsteyen: " + n.byNick + (st.paused ? " · duraklatıldı" : "") : "";
    $("bar").hidden = !n;
    $("ctl").hidden = !st || (!n && !st.queue.length);
    $("pp").innerHTML = st?.paused ? ICON.play : ICON.pause;
    $("pp").title = st?.paused ? "Devam" : "Duraklat";
    $("pp").disabled = !n;
    $("skip").disabled = !n;
    if (st && !dragging) { $("vol").value = st.volume; $("volv").textContent = "%" + st.volume; }
    $("notice").hidden = !st?.notice;
    $("notice").textContent = st?.notice || "";
    $("add").textContent = n ? "Sıraya ekle" : "Çal";
    const q = st?.queue ?? [];
    $("qtitle").textContent = q.length ? `Sıra · ${q.length}` : "Sıra";
    $("clear").hidden = q.length < 2;
    const box = $("queue");
    box.replaceChildren();
    if (!q.length) { const e = document.createElement("div"); e.className = "empty"; e.textContent = "Sıra boş."; box.append(e); }
    q.forEach((t, i) => {
      const row = document.createElement("div");
      row.className = "item";
      const num = document.createElement("i"); num.textContent = i + 1;
      const tx = document.createElement("div");
      const b = document.createElement("b"); b.textContent = t.title;
      const sm = document.createElement("small"); sm.textContent = t.byNick;
      tx.append(b, sm);
      const x = document.createElement("button"); x.title = "Sıradan çıkar"; x.innerHTML = ICON.x; x.onclick = () => act("remove", { i });
      row.append(num, tx, x);
      box.append(row);
    });
    renderLists();
    tick();
  }

  // ---- calma listeleri
  function renderLists() {
    const box = $("lists");
    const ls = st?.lists ?? [];
    box.replaceChildren();
    if (!ls.length) { const e = document.createElement("div"); e.className = "empty"; e.textContent = "Liste yok. Sık dinlediğiniz şarkıları bir listeye toplayabilirsin."; box.append(e); return; }
    for (const p of ls) {
      const row = document.createElement("div");
      row.className = "item";
      const tx = document.createElement("div");
      const b = document.createElement("b"); b.textContent = p.name;
      const sm = document.createElement("small"); sm.textContent = p.count + " şarkı";
      tx.append(b, sm);
      const acts = document.createElement("div"); acts.className = "acts";
      const play = document.createElement("button"); play.className = "play"; play.textContent = "Çal"; play.title = "Listeden karışık 20 şarkı sıraya";
      play.onclick = () => act("pl.play", { id: p.id });
      acts.append(play);
      if (p.by === me?.uid || manage) {
        const ed = document.createElement("button"); ed.textContent = "Düzenle"; ed.onclick = () => act("pl.get", { id: p.id });
        const del = document.createElement("button"); del.textContent = "Sil";
        del.onclick = () => { if (del.dataset.armed) return act("pl.delete", { id: p.id }); del.dataset.armed = "1"; del.textContent = "Silinsin mi?"; setTimeout(() => { delete del.dataset.armed; del.textContent = "Sil"; }, 3000); };
        acts.append(ed, del);
      }
      row.append(tx, acts);
      box.append(row);
    }
  }
  function openEditor(pl) {
    editing = pl?.id ?? null;
    $("plname").value = pl?.name ?? "";
    $("plsongs").value = (pl?.songs ?? []).join("\n");
    recount();
    $("editor").hidden = false;
    $("plname").focus();
  }
  const closeEditor = () => { editing = null; $("editor").hidden = true; };
  const recount = () => { $("plcount").textContent = $("plsongs").value.split("\n").map((x) => x.trim()).filter(Boolean).length + " şarkı"; };
  function showErr(text) {
    $("err").textContent = text; $("err").hidden = false;
    clearTimeout(errTimer); errTimer = setTimeout(() => { $("err").hidden = true; }, 8000);
  }

  window.addEventListener("message", (e) => {
    const m = e.data;
    if (e.source !== parent || !m) return;
    if (m.bunker === "message") {
      // sadece bana: liste icerigi, kayit sonucu, hata
      const d = m.data || {};
      if (d.type === "pl") openEditor(d.pl);
      else if (d.type === "saved") closeEditor();
      else if (d.type === "error") showErr(d.text);
      return;
    }
    if (m.bunker !== "state") return;
    me = m.ctx?.me ?? null;
    manage = Boolean(m.ctx?.manage);
    const t = m.ctx?.theme;
    if (t) for (const k of ["bg", "text", "muted", "accent", "border", "hover"]) if (t[k]) document.documentElement.style.setProperty("--" + k, t[k]);
    st = m.state;
    rx = Date.now() - (Number(m.ctx?.age) || 0); // durum eskiyse (pencere yeniden acildi vb.) gecen sureyi say
    render();
    if (!m.state && !asked) { asked = true; act("hello"); }
  });
  // Izole cercevede form gonderme kapali (submit olayi hic gelmez): tiklama + Enter
  const add = () => { const v = $("q").value.trim(); if (v) act("add", { q: v }); $("q").value = ""; };
  $("add").onclick = add;
  $("q").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); add(); } });
  $("pp").onclick = () => act(st?.paused ? "resume" : "pause");
  $("skip").onclick = () => act("skip");
  $("stop").onclick = () => act("stop");
  $("clear").onclick = () => act("clear");
  $("vol").oninput = () => {
    dragging = true;
    $("volv").textContent = "%" + $("vol").value;
    clearTimeout(volTimer);
    volTimer = setTimeout(() => { act("volume", { v: Number($("vol").value) }); dragging = false; }, 150);
  };
  $("newlist").onclick = () => openEditor(null);
  $("plcancel").onclick = closeEditor;
  $("plsongs").addEventListener("input", recount);
  $("plsave").onclick = () => {
    const name = $("plname").value.trim();
    if (!name) return $("plname").focus();
    act("pl.save", { id: editing || undefined, name, songs: $("plsongs").value.split("\n") });
  };
  parent.postMessage({ bunker: "ready" }, "*");
  $("q").focus();
</script>
</body>
</html>
